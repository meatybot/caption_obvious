name: Publish image

# A published GitHub release builds the image for amd64 and arm64 and pushes it to GHCR, tagged with the
# version from appinfo/info.xml. The release tag must be that version with a leading "v".
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: Build and push
    runs-on: ubuntu-24.04
    if: ${{ github.repository_owner == 'meatybot' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Read version from info.xml
        id: version
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq libxml2-utils
          version=$(xmllint --xpath 'string(//external-app/docker-install/image-tag)' appinfo/info.xml)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "image-tag: $version"

      - name: Release tag matches info.xml
        if: github.event_name == 'release'
        run: test "${{ github.event.release.tag_name }}" = "v${{ steps.version.outputs.version }}"

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ghcr.io/${{ github.repository_owner }}/caption_obvious:${{ steps.version.outputs.version }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
            org.opencontainers.image.licenses=MIT
          cache-from: type=gha
          cache-to: type=gha,mode=max
